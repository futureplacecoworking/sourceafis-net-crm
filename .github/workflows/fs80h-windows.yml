name: Agente FS80H — Windows

on:
  push:
    branches: [master]
    paths:
      - 'AgenteFS80H/**'
      - 'AgenteFS80H.Core/**'
      - 'AgenteFS80H.Tests/**'
      - 'AgenteFS80H.Desktop.Tests/**'
      - 'SourceAFIS/**'
      - 'SourceAFIS.Tests/**'
      - 'installer/**'
      - 'docs/AGENTE-FS80H.md'
      - '.github/workflows/fs80h-windows.yml'
  pull_request:
    paths:
      - 'AgenteFS80H/**'
      - 'AgenteFS80H.Core/**'
      - 'AgenteFS80H.Tests/**'
      - 'AgenteFS80H.Desktop.Tests/**'
      - 'SourceAFIS/**'
      - 'SourceAFIS.Tests/**'
      - 'installer/**'
      - 'docs/AGENTE-FS80H.md'
      - '.github/workflows/fs80h-windows.yml'
  workflow_dispatch:
    inputs:
      create_draft_release:
        description: Criar rascunho de release depois dos testes e empacotamento
        required: true
        default: false
        type: boolean
      release_tag:
        description: Tag exclusiva para o rascunho (exemplo agente-fs80h-v1.0.0)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fs80h-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Testar e gerar instalador por usuário
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Verificar sintaxe dos scripts de instalação
        shell: pwsh
        run: |
          foreach ($script in (Get-ChildItem installer/*.ps1 | Select-Object -ExpandProperty FullName)) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -ne 0) { throw ($script + ': ' + ($parseErrors | Format-List | Out-String)) }
          }
      - name: Testar biblioteca SourceAFIS
        run: dotnet test SourceAFIS.Tests/SourceAFIS.Tests.csproj --configuration Release --logger trx --results-directory artifacts/test-results/sourceafis
      - name: Testar protocolo, proteção e fluxo do agente
        run: dotnet test AgenteFS80H.Tests/AgenteFS80H.Tests.csproj --configuration Release --logger trx --results-directory artifacts/test-results/agente
      - name: Testar a interface Windows e gerar prévias nativas
        timeout-minutes: 5
        env:
          FS80H_UI_OUTPUT: ${{ github.workspace }}/artifacts/ui
        run: dotnet test AgenteFS80H.Desktop.Tests/AgenteFS80H.Desktop.Tests.csproj --configuration Release --runtime win-x64 -p:SelfContained=false --logger trx --blame-hang --blame-hang-timeout 45s --blame-hang-dump-type none --results-directory artifacts/test-results/desktop
      - name: Publicar Windows x64 autocontido
        run: dotnet publish AgenteFS80H/AgenteFS80H.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/bundle/app /p:PublishSingleFile=false /p:PublishTrimmed=false /p:PublishReadyToRun=false
      - name: Preparar pacote instalável
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $PWD 'artifacts/bundle'
          foreach ($required in @('AgenteFS80H.exe', 'AgenteFS80H.Core.dll', 'SourceAFIS.dll', 'coreclr.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $bundle "app/$required"))) {
              throw "Arquivo de publicação ausente: $required"
            }
          }
          if (Get-ChildItem -LiteralPath $bundle -Recurse -Filter 'ftrScanAPI.dll') {
            throw 'O pacote não pode redistribuir a DLL proprietária Futronic.'
          }
          Copy-Item installer/Install.ps1, installer/Uninstall.ps1 -Destination $bundle
          Copy-Item docs/AGENTE-FS80H.md -Destination (Join-Path $bundle 'LEIA-ME.md')
          Copy-Item LICENSE -Destination $bundle
          @{
            commit = '${{ github.sha }}'
            platform = 'win-x64'
            framework = 'net10.0-windows'
            contains_futronic_binaries = $false
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $bundle 'build-info.json') -Encoding utf8
          $zip = Join-Path $PWD 'artifacts/AgenteFS80H-win-x64.zip'
          Compress-Archive -Path (Join-Path $bundle '*') -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AgenteFS80H-win-x64.zip" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii
      - name: Verificar instalação, inicialização e remoção por usuário
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $PWD 'artifacts/bundle'
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\Futureplace\AgenteFS80H'
          $data = Join-Path $env:LOCALAPPDATA 'Futureplace\AgenteFS80H\data'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $runName = 'FutureplaceAgenteFS80H'
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\FutureplaceAgenteFS80H'
          & (Join-Path $bundle 'Install.ps1') -NoStart
          if (-not (Test-Path -LiteralPath (Join-Path $installed 'AgenteFS80H.exe'))) { throw 'Instalação não copiou o aplicativo.' }
          if (-not (Test-Path -LiteralPath $uninstallKey)) { throw 'Instalação não registrou o desinstalador.' }
          $startup = (Get-ItemProperty -LiteralPath $runKey -Name $runName).$runName
          $expected = '"' + (Join-Path $installed 'AgenteFS80H.exe') + '" --background'
          if ($startup -ne $expected) { throw 'Inicialização automática incorreta.' }
          New-Item -ItemType Directory -Path $data -Force | Out-Null
          $marker = Join-Path $data 'ci-preservation.marker'
          'synthetic installer check' | Set-Content -LiteralPath $marker
          & (Join-Path $installed 'Uninstall.ps1') -KeepData
          if (-not (Test-Path -LiteralPath $marker)) { throw 'Desinstalação não preservou os dados solicitados.' }
          if (Test-Path -LiteralPath $installed) { throw 'Desinstalação não removeu o aplicativo.' }
          if (Get-ItemProperty -LiteralPath $runKey -Name $runName -ErrorAction SilentlyContinue) { throw 'Desinstalação manteve a inicialização automática.' }
          & (Join-Path $bundle 'Install.ps1') -NoStart -NoStartup
          if (Get-ItemProperty -LiteralPath $runKey -Name $runName -ErrorAction SilentlyContinue) { throw 'NoStartup foi ignorado.' }
          & (Join-Path $installed 'Uninstall.ps1') -RemoveData
          if (Test-Path -LiteralPath $data) { throw 'Remoção explícita dos dados foi ignorada.' }
          if (Test-Path -LiteralPath $uninstallKey) { throw 'Desinstalação manteve o registro de aplicativo.' }
      - name: Preparar instalação antiga real para testar migração
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch --no-tags --depth=1 origin 9d758cfc7dac302ece29c42bf0feef3c712e6d42
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível obter a versão 1.2.0 para testar a migração.' }
          git worktree add --detach artifacts/legacy-source FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível preparar o código antigo.' }
          dotnet publish artifacts/legacy-source/AgenteFS80H/AgenteFS80H.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/legacy-bundle/app /p:PublishSingleFile=false /p:PublishTrimmed=false /p:PublishReadyToRun=false
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível gerar a versão antiga real.' }
          Copy-Item artifacts/legacy-source/installer/Install.ps1, artifacts/legacy-source/installer/Uninstall.ps1, artifacts/legacy-source/LICENSE -Destination artifacts/legacy-bundle
          Copy-Item artifacts/legacy-source/docs/AGENTE-FS80H.md -Destination artifacts/legacy-bundle/LEIA-ME.md
      - name: Compilar instalador gráfico da Central Biométrica
        shell: pwsh
        run: ./installer/Build-Setup.ps1
      - name: Verificar instalador EXE, atualização e desinstalação reais
        timeout-minutes: 10
        shell: pwsh
        run: |
          [xml]$project = Get-Content AgenteFS80H/AgenteFS80H.csproj -Raw
          ./installer/Test-Setup.ps1 -SetupPath "$PWD/artifacts/setup/Central-Biometrica-Setup.exe" -BundlePath "$PWD/artifacts/bundle" -LegacyBundlePath "$PWD/artifacts/legacy-bundle" -ExpectedVersion ([string]$project.Project.PropertyGroup.Version)
      - name: Disponibilizar instalador EXE e manifesto de atualização
        uses: actions/upload-artifact@v4
        with:
          name: Central-Biometrica-Windows
          path: artifacts/setup/
          if-no-files-found: error
          retention-days: 30
      - name: Disponibilizar prévias e evidências do instalador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Central-Biometrica-setup-preview
          path: artifacts/setup-tests/
          if-no-files-found: warn
          retention-days: 14
      - name: Transporte do instalador 1
        if: success() && hashFiles('artifacts/setup-parts/part-01/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Central-Biometrica-transporte-01
          path: artifacts/setup-parts/part-01/
          if-no-files-found: error
          retention-days: 7
      - name: Transporte do instalador 2
        if: success() && hashFiles('artifacts/setup-parts/part-02/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Central-Biometrica-transporte-02
          path: artifacts/setup-parts/part-02/
          if-no-files-found: error
          retention-days: 7
      - name: Transporte do instalador 3
        if: success() && hashFiles('artifacts/setup-parts/part-03/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Central-Biometrica-transporte-03
          path: artifacts/setup-parts/part-03/
          if-no-files-found: error
          retention-days: 7
      - name: Transporte do instalador 4
        if: success() && hashFiles('artifacts/setup-parts/part-04/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Central-Biometrica-transporte-04
          path: artifacts/setup-parts/part-04/
          if-no-files-found: error
          retention-days: 7
      - name: Transporte do instalador 5
        if: success() && hashFiles('artifacts/setup-parts/part-05/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Central-Biometrica-transporte-05
          path: artifacts/setup-parts/part-05/
          if-no-files-found: error
          retention-days: 7
      - name: Transporte do instalador 6
        if: success() && hashFiles('artifacts/setup-parts/part-06/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Central-Biometrica-transporte-06
          path: artifacts/setup-parts/part-06/
          if-no-files-found: error
          retention-days: 7
      - name: Disponibilizar ZIP e checksum
        uses: actions/upload-artifact@v4
        with:
          name: AgenteFS80H-win-x64
          path: |
            artifacts/AgenteFS80H-win-x64.zip
            artifacts/AgenteFS80H-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Disponibilizar resultados de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AgenteFS80H-test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn
          retention-days: 14
      - name: Disponibilizar instalação com uma única extração
        uses: actions/upload-artifact@v4
        with:
          name: AgenteFS80H-instalacao-Windows
          path: artifacts/bundle/
          if-no-files-found: error
          retention-days: 30
      - name: Disponibilizar prévias da interface Windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AgenteFS80H-ui-previews
          path: artifacts/ui/**/*.png
          if-no-files-found: warn
          retention-days: 30

  draft-release:
    name: Criar rascunho solicitado manualmente
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' && inputs.create_draft_release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AgenteFS80H-win-x64
          path: package
      - name: Criar release em rascunho
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^agente-fs80h-v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?$') {
            throw 'Informe uma tag no formato agente-fs80h-v1.0.0.'
          }
          @'
          Agente Windows x64 autocontido para captura Futronic FS80H e comparação SourceAFIS local.

          Extraia o ZIP completo e siga LEIA-ME.md. Instalação por usuário, sem precisar instalar o .NET.
          Driver e DLL oficiais Futronic são obtidos separadamente do fabricante.
          A autorização depende da Central conectada. Esta versão não aciona fechadura.
          O teste físico no computador do leitor continua necessário.
          '@ | Set-Content -LiteralPath release-notes.md -Encoding utf8
          gh release create $env:RELEASE_TAG package/AgenteFS80H-win-x64.zip package/AgenteFS80H-win-x64.zip.sha256 --draft --target $env:RELEASE_COMMIT --title "Agente FS80H $env:RELEASE_TAG" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível criar o rascunho de release.' }

  publish-biometrica:
    name: Publicar nova versão da Central Biométrica
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Central-Biometrica-Windows
          path: package
      - name: Publicar EXE, checksum e manifesto oficial
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content package/update.json -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Versão de publicação inválida.' }
          $tag = 'central-biometrica-v' + $version
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Esta versão já foi publicada. Incremente Version no projeto para publicar uma atualização.' }
          gh release create $tag package/Central-Biometrica-Setup.exe package/Central-Biometrica-Setup.exe.sha256 package/update.json --target '${{ github.sha }}' --latest --title "Central Biométrica $version" --notes-file docs/ALTERACOES-CENTRAL-BIOMETRICA.md
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar a atualização oficial.' }
